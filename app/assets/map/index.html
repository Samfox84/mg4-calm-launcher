<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
<style>
  html,body,#map{height:100%;margin:0;background:#0E1114;}
  /* AuDHD calm: dark, low-contrast, no bright UI */
  .leaflet-container{background:#0E1114;font-family:sans-serif;}
  .leaflet-control-zoom,.leaflet-control-attribution a{display:none !important;}
  .leaflet-control-attribution{background:rgba(14,17,20,.55);color:#6B7682;font-size:10px;padding:1px 5px;}
  .me{width:22px;height:22px;border-radius:50%;background:#7CB8F0;
      box-shadow:0 0 0 6px rgba(124,184,240,.18),0 0 14px rgba(124,184,240,.5);}
  .me-wrap{position:relative;}
</style>
</head>
<body>
<div id="map"></div>
<script>
  var map = L.map('map',{zoomControl:false,attributionControl:true,
      fadeAnimation:true,zoomAnimation:true,inertia:false,keyboard:false,
      dragging:false,touchZoom:false,doubleClickZoom:false,scrollWheelZoom:false,boxZoom:false,tap:false});
  map.setView([51.5,-0.12],16);
  var tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      {maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO',crossOrigin:true});
  var okReported=false, errReported=false;
  tiles.on('load', function(){ if(!okReported){okReported=true; try{AndroidMap.status('tiles-ok');}catch(e){}} });
  tiles.on('tileerror', function(){ if(!errReported){errReported=true; try{AndroidMap.status('tiles-error');}catch(e){}} });
  tiles.addTo(map);
  var icon = L.divIcon({className:'',html:'<div class="me-wrap"><div class="me"></div></div>',iconSize:[22,22],iconAnchor:[11,11]});
  var me = L.marker([51.5,-0.12],{icon:icon,interactive:false}).addTo(map);
  var first=true;
  // Called from Android with the car's live GPS.
  window.setPos = function(lat, lon){
    var ll = [lat, lon];
    me.setLatLng(ll);
    if(first){ map.setView(ll, 16, {animate:false}); first=false; try{AndroidMap.status('fix');}catch(e){} }
    else { map.panTo(ll, {animate:true, duration:0.8}); }
  };
  try{AndroidMap.status('page-ready');}catch(e){}
</script>
</body>
</html>
