<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="leaflet.css" rel="stylesheet">
<script src="polyfills.js"></script>
<script src="leaflet.js"></script>
<script src="protomaps-leaflet.js"></script>
<style>
  html,body,#map{height:100%;margin:0;background:#0E1114;}
  .leaflet-container{background:#0E1114;}
  .leaflet-control-attribution{display:none !important;}
  .leaflet-bar a{background:#1B2024;color:#E7ECF0;border-bottom-color:#2A3036;width:64px;height:64px;line-height:64px;font-size:34px;}
  .leaflet-bar a:hover{background:#242C33;}
  #nightdim{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:401;background:rgba(0,0,0,.32);display:none;}
  #vignette{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:450;
      background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 34%, rgba(0,0,0,.42) 72%, rgba(0,0,0,.9) 100%);}
  #street{position:absolute;left:22px;bottom:24px;z-index:500;color:#EEF2F6;font:600 27px sans-serif;
      letter-spacing:.2px;text-shadow:0 2px 12px rgba(0,0,0,.85);pointer-events:none;max-width:72%;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .me-dot{width:18px;height:18px;border-radius:50%;background:#4F9BF0;border:2px solid #cfe4ff;
          box-shadow:0 0 0 0 rgba(79,155,240,.55);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,155,240,.55)}70%{box-shadow:0 0 0 20px rgba(79,155,240,0)}100%{box-shadow:0 0 0 0 rgba(79,155,240,0)}}
  #recenter{position:absolute;right:16px;bottom:150px;z-index:600;display:none;
            background:#1B2024;color:#E7ECF0;border:1px solid #2A3036;border-radius:28px;
            padding:15px 26px;font:600 22px sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.4);}
  /* calm.113: fascia "prossima manovra" dal feed CarPlay (Apple/Google). In alto, sopra il velo. */
  /* calm.119: pill "prossima manovra + ETA". Su CLUSTER (cl=1) viene posizionata vicino al pallino. */
  #turn{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:620;display:none;
        max-width:86%;background:rgba(16,19,22,.88);color:#EEF2F6;border:1px solid #2A3036;
        border-radius:999px;padding:7px 15px;font:700 21px sans-serif;letter-spacing:.2px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 14px rgba(0,0,0,.65);}
  #turn .d{color:#4F9BF0;}
  #turn .e{color:#AEB6BF;font-weight:600;font-size:17px;}
  #turn .r{display:block;font-weight:700;margin-bottom:1px;}   /* calm.122: riga della via (quadro, due righe) */
</style>
</head>
<body>
<div id="map"></div>
<div id="vignette"></div>
<div id="nightdim"></div>
<div id="street"></div>
<div id="turn"></div>
<div id="recenter">Recenter</div>
<script>
  window.onerror=function(m,src,ln){ try{console.error('map: onerror '+m+' @'+src+':'+ln);}catch(e){} };
  function q(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):'';}
  console.log('map: page start, origin='+location.origin);
  if(q('dim')==='1'){ var nd=document.getElementById('nightdim'); if(nd) nd.style.display='block'; }
  // calm.110: dove tenere il pallino sullo schermo (0..1). Serve sul QUADRO, dove il riquadro visibile
  // non è centrato sulla finestra: spostando l'ancora si rimette il pallino al centro di ciò che si vede.
  var AX=parseFloat(q('ax')); if(isNaN(AX)||AX<0||AX>1) AX=0.5;
  var AY=parseFloat(q('ay')); if(isNaN(AY)||AY<0||AY>1) AY=0.5;
  var ROT=q('rot')==='1';   // calm.113: heading-up (mappa ruota verso la marcia) — solo quadro
  var ZB=parseFloat(q('zb')); if(isNaN(ZB)) ZB=0; ZB=Math.max(-2,Math.min(2,ZB));   // calm.117: regolazione zoom (+vicino / -lontano)
  var CL=q('cl')==='1';   // calm.119: mappa del quadro (pill manovra vicino al pallino)
  var HS=q('hs')==='1';   // calm.119: nascondi la scritta via nella webview (la mostra la home come testo nativo)
  var purl=location.origin+'/map.pmtiles';
  try{
    var map=L.map('map',{zoomControl:false,attributionControl:false,
        dragging:true,touchZoom:true,doubleClickZoom:true,scrollWheelZoom:false,inertia:true,zoomSnap:0.5}).setView([52.5,-2.5],16);
    L.control.zoom({position:'bottomright'}).addTo(map);
    var layer=protomapsL.leafletLayer({url:purl,flavor:'dark',lang:'en',pane:'tilePane',keepBuffer:12});
    var tileN=0, reported=false;
    function ok(){ if(!reported){reported=true; try{AndroidMap.status('engine-ok');}catch(e){}} }
    if (layer.on){ layer.on('load', ok); layer.on('tileload', function(){ tileN++; }); layer.on('tileerror', function(){ try{AndroidMap.status('engine-error:tileerror');}catch(e){} }); }
    layer.addTo(map);
    console.log('map: layer added');

    // calm.110: centro che mette il pallino al punto (AX,AY) dello schermo invece che al centro della finestra.
    function anchorCenter(ll, z){
      try{
        z = (z==null) ? map.getZoom() : z;
        var s=map.getSize();
        var p=map.project(ll, z).add([s.x*(0.5-AX), s.y*(0.5-AY)]);
        return map.unproject(p, z);
      }catch(e){ return ll; }
    }

    // calm.113: heading-up — ruota TUTTA la mappa attorno al pallino (AX,AY) verso la direzione di marcia.
    // Gli overlay (via, fascia manovra, velo) sono fratelli di #map, quindi restano dritti e leggibili.
    var mapEl=document.getElementById('map'), dispBearing=0, rotReady=false;
    function applyRotation(){
      if(!ROT || !mapEl) return;
      if(!rotReady){ mapEl.style.transformOrigin=(AX*100)+'% '+(AY*100)+'%';
        mapEl.style.transition='transform .8s linear'; rotReady=true; }
      // scala 1.35: copre gli angoli quando la vista è ruotata, così non appare nero vicino al pallino
      mapEl.style.transform='scale(1.35) rotate('+(-dispBearing)+'deg)';
    }
    function setBearing(b){
      if(!ROT || typeof b!=='number' || b<0) return;
      var d=((b-dispBearing+540)%360)-180;   // via più corta (evita il giro 359→0)
      dispBearing+=d; applyRotation();
    }
    if(ROT){ applyRotation(); }

    // calm.113: fascia "prossima manovra" dal feed CarPlay (Apple/Google Maps). Solo testo del feed.
    var turnEl=document.getElementById('turn');
    // calm.122: sul quadro la pill sta SOPRA il pallino (parte alta del buco visibile, mai in fondo), compatta su due
    // righe, e con una larghezza limitata al buco così non esce mai dal bordo destro.
    if(CL && turnEl){
      var half=Math.min(AX,1-AX);                               // metà più stretta: tiene la pill dentro lo schermo
      turnEl.style.left=(AX*100)+'%';
      turnEl.style.top='calc('+(AY*100)+'% + 42px)';            // ancora 42px SOTTO il pallino (dietro l'auto)…
      turnEl.style.transform='translate(-50%,0)';               // …così non copre il percorso evidenziato davanti
      turnEl.style.maxWidth='calc('+(2*half*100).toFixed(1)+'% - 16px)';
      turnEl.style.whiteSpace='normal';                         // due righe se serve
      turnEl.style.textAlign='center';
      turnEl.style.lineHeight='1.25';
      turnEl.style.font='700 18px sans-serif';
      turnEl.style.borderRadius='16px';
    }
    window.setTurn=function(active, dist, road, eta){
      if(!turnEl) return;
      if(!active){ turnEl.style.display='none'; return; }
      var d=(dist||'').trim(), r=(road||'').trim(), e=(eta||'').trim();
      if(!d && !r){ turnEl.style.display='none'; return; }
      var html='';
      if(CL){
        // quadro: via sopra, "▸ distanza · ETA" sotto
        if(r) html+='<span class="r">'+r+'</span>';
        var l2='';
        if(d) l2+='<span class="d">▸ '+d+'</span>';
        if(e) l2+=(d?' · ':'')+'<span class="e">'+e+'</span>';
        if(l2) html+='<span>'+l2+'</span>';
      } else {
        if(d) html+='<span class="d">▸ '+d+'</span>';
        if(r) html+=(d?'&nbsp;&nbsp;':'')+r;
        if(e) html+='&nbsp;&nbsp;<span class="e">'+e+'</span>';
      }
      turnEl.innerHTML=html; turnEl.style.display='block';
    };

    var meIcon=L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
    var me=L.marker([52.5,-2.5],{icon:meIcon,interactive:false,keyboard:false});

    // calm.113: TRACCIA evidenziata = percorso realmente guidato (GPS). Sempre corretta, nessun dato mappa.
    var trailPts=[], trailLine=null, trailGlow=null, lastTrailLL=null;
    function addTrail(lat,lon){
      try{
        if(lastTrailLL){ if(L.latLng(lat,lon).distanceTo(L.latLng(lastTrailLL[0],lastTrailLL[1]))<4) return; }
        lastTrailLL=[lat,lon]; trailPts.push([lat,lon]); if(trailPts.length>500) trailPts.shift();
        if(!trailLine){
          trailGlow=L.polyline([],{color:'#2E6FB7',weight:14,opacity:.30,lineJoin:'round',lineCap:'round',interactive:false}).addTo(map);
          trailLine=L.polyline([],{color:'#4F9BF0',weight:6,opacity:.95,lineJoin:'round',lineCap:'round',interactive:false}).addTo(map);
        }
        trailGlow.setLatLngs(trailPts); trailLine.setLatLngs(trailPts);
      }catch(e){}
    }
    // calm.113: CALIBRAZIONE — ogni ~3s registra la geometria della strada sotto l'auto (verità = GPS),
    // per tarare in modo sicuro il tracciamento del percorso in AVANTI nella prossima versione.
    var lastCalib=0;
    function calibDump(lat,lon){
      var now=Date.now(); if(now-lastCalib<3000) return; lastCalib=now;
      try{
        var zs=[15,14,16], best=null, bz=-1;
        for(var zi=0; zi<zs.length && !best; zi++){ var arr=featuresAt(lat,lon,zs[zi]);
          for(var i=0;i<arr.length;i++){ var e=arr[i]; if(e.feature&&e.feature.geomType===2&&isRoad(e.layerName)){ best=e; bz=zs[zi]; break; } } }
        if(!best){ try{AndroidMap.status('calib: gps='+lat.toFixed(5)+','+lon.toFixed(5)+' road=none');}catch(x){} return; }
        var g=best.feature.geom, nm=roadName(propsOf(best))||'?';
        var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9,np=0,first=null,last=null;
        for(var a=0;a<g.length;a++){ var seg=g[a]; for(var b=0;b<seg.length;b++){ var pt=seg[b]; np++; if(!first)first=pt; last=pt;
            if(pt.x<minx)minx=pt.x; if(pt.x>maxx)maxx=pt.x; if(pt.y<miny)miny=pt.y; if(pt.y>maxy)maxy=pt.y; } }
        AndroidMap.status('calib: gps='+lat.toFixed(5)+','+lon.toFixed(5)+' z='+bz+' road='+nm+' pts='+np
          +' x['+minx.toFixed(1)+'..'+maxx.toFixed(1)+'] y['+miny.toFixed(1)+'..'+maxy.toFixed(1)+']'
          +' f='+(first?first.x.toFixed(1)+','+first.y.toFixed(1):'?')+' l='+(last?last.x.toFixed(1)+','+last.y.toFixed(1):'?'));
      }catch(e){ try{AndroidMap.status('calib: err '+e);}catch(x){} }
    }

    // ===== calm.114: PERCORSO IN AVANTI (dove DEVO andare) ==============================
    // Legge il feed CarPlay (Apple/Google: distanza alla prossima svolta + strada dopo) e disegna la
    // strada DAVANTI fino alla svolta, sulla mappa offline. Geometria dal file mappa, convertita in
    // lat/lon leggendo le impostazioni della libreria a runtime. Disegna SOLO se l'auto risulta sulla
    // strada trovata (controllo di sicurezza): così non può mai disegnare una linea sbagliata.
    var routeGlow=null, routeLine=null, routeTurn=null, lastBrg=-1, vLogged=false;
    var navActive=false, navDistM=-1, navRoad='', navTurn='';
    function lonNx(lon){ return (lon+180)/360; }
    function latNy(lat){ var r=lat*Math.PI/180; return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2; }
    function nxLon(nx){ return nx*360-180; }
    function nyLat(ny){ return Math.atan(Math.sinh(Math.PI*(1-2*ny)))*180/Math.PI; }
    function viewInfo(){
      var V=null; try{ if(layer.views&&layer.views.forEach) layer.views.forEach(function(v){ if(!V)V=v; }); }catch(e){}
      if(!V||!V.tileCache) return null;
      return { ts:(V.tileCache.tileSize||512), ld:(V.levelDiff==null?1:V.levelDiff), md:(V.maxDataLevel==null?15:V.maxDataLevel) };
    }
    // Strade vicine al punto, come polilinee in lat/lon (converte la geometria del tile → coordinate vere).
    function roadsNear(lat,lon,Zd){
      var vi=viewInfo(); if(!vi) return [];
      var o=Math.min(Math.round(Zd)-vi.ld, vi.md); if(o<0)o=0;
      var c=Math.floor(lonNx(lon)*(1<<o)), u=Math.floor(latNy(lat)*(1<<o));
      var arr=featuresAt(lat,lon,Zd), out=[];
      for(var i=0;i<arr.length;i++){ var e=arr[i]; if(!e.feature||e.feature.geomType!==2||!isRoad(e.layerName)) continue;
        var g=e.feature.geom, nm=roadName(propsOf(e))||'';
        for(var a=0;a<g.length;a++){ var seg=g[a]; if(!seg||seg.length<2) continue;
          var pts=[]; for(var b=0;b<seg.length;b++){ var p=seg[b];
            var gnx=(c+p.x/vi.ts)/(1<<o), gny=(u+p.y/vi.ts)/(1<<o);
            pts.push([nyLat(gny), nxLon(gnx)]); }
          out.push({name:nm, pts:pts}); } }
      return out;
    }
    // metri tra due [lat,lon]
    function md(a,b){ try{ return L.latLng(a[0],a[1]).distanceTo(L.latLng(b[0],b[1])); }catch(e){ return 1e9; } }
    // proiezione del punto P sul segmento A-B (in metri locali), ritorna {d, t, pt}
    function projSeg(P,A,B){
      var kx=Math.cos(P[0]*Math.PI/180)*111320, ky=110540;
      var ax=(A[1]-P[1])*kx, ay=(A[0]-P[0])*ky, bx=(B[1]-P[1])*kx, by=(B[0]-P[0])*ky;
      var dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
      var t = L2>0 ? -(ax*dx+ay*dy)/L2 : 0; t=Math.max(0,Math.min(1,t));
      var px=ax+t*dx, py=ay+t*dy; var d=Math.sqrt(px*px+py*py);
      var pt=[A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t];
      return {d:d, t:t, pt:pt};
    }
    // aggancia l'auto alla strada più vicina; ritorna {road, seg, t, pt, d}
    function snap(lat,lon,roads){
      var best=null, P=[lat,lon];
      for(var i=0;i<roads.length;i++){ var pts=roads[i].pts;
        for(var j=0;j<pts.length-1;j++){ var pr=projSeg(P,pts[j],pts[j+1]);
          if(!best||pr.d<best.d) best={road:i,seg:j,t:pr.t,pt:pr.pt,d:pr.d}; } }
      return best;
    }
    function bearingOf(a,b){ // gradi 0..360
      var y=Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180);
      var x=Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180);
      var d=Math.atan2(y,x)*180/Math.PI; return (d+360)%360;
    }
    function angDiff(a,b){ var d=Math.abs(a-b)%360; return d>180?360-d:d; }
    // cammina lungo la strada agganciata nella direzione di marcia, fino a distM metri
    function walkForward(road, snapInfo, brg, distM){
      var pts=road.pts, out=[snapInfo.pt];
      // direzione: avanti (j+1..) o indietro (j..0) secondo quale tangente somiglia alla rotta
      var segA=pts[snapInfo.seg], segB=pts[snapInfo.seg+1];
      var fwdBrg=bearingOf(segA,segB);
      var forward = (brg<0) ? true : angDiff(brg,fwdBrg)<=90;
      var acc=0, cur=snapInfo.pt;
      if(forward){
        for(var j=snapInfo.seg+1;j<pts.length;j++){ var step=md(cur,pts[j]); if(acc+step>=distM){ var r=(distM-acc)/step; out.push([cur[0]+(pts[j][0]-cur[0])*r, cur[1]+(pts[j][1]-cur[1])*r]); return {pts:out, done:true, end:out[out.length-1]}; } acc+=step; out.push(pts[j]); cur=pts[j]; }
      } else {
        for(var k=snapInfo.seg;k>=0;k--){ var step2=md(cur,pts[k]); if(acc+step2>=distM){ var r2=(distM-acc)/step2; out.push([cur[0]+(pts[k][0]-cur[0])*r2, cur[1]+(pts[k][1]-cur[1])*r2]); return {pts:out, done:true, end:out[out.length-1]}; } acc+=step2; out.push(pts[k]); cur=pts[k]; }
      }
      return {pts:out, done:false, end:cur, acc:acc};   // finito il tile prima della svolta
    }
    function clearRoute(){ try{ if(routeLine){routeLine.setLatLngs([]); routeGlow.setLatLngs([]);} if(routeTurn) routeTurn.setLatLngs([]); }catch(e){} }
    function drawRoute(pts, turnPts){
      try{
        if(!routeLine){
          routeGlow=L.polyline([],{color:'#1E5FAE',weight:18,opacity:.35,lineJoin:'round',lineCap:'round',interactive:false}).addTo(map);
          routeLine=L.polyline([],{color:'#4F9BF0',weight:8,opacity:.98,lineJoin:'round',lineCap:'round',interactive:false}).addTo(map);
          routeTurn=L.polyline([],{color:'#7FC0FF',weight:8,opacity:.98,lineJoin:'round',lineCap:'round',dashArray:'2,10',interactive:false}).addTo(map);
        }
        routeGlow.setLatLngs(pts); routeLine.setLatLngs(pts); routeTurn.setLatLngs(turnPts||[]);
      }catch(e){ try{AndroidMap.status('route: draw err '+e);}catch(x){} }
    }
    function getView(){ var V=null; try{ if(layer.views&&layer.views.forEach) layer.views.forEach(function(v){ if(!V)V=v; }); }catch(e){} return V; }
    // punto a `m` metri da (lat,lon) lungo la rotta `brg`
    function dest(lat,lon,brg,m){ var R=6378137, d=m/R, b=brg*Math.PI/180, la=lat*Math.PI/180, lo=lon*Math.PI/180;
      var la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));
      var lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la), Math.cos(d)-Math.sin(la)*Math.sin(la2));
      return [la2*180/Math.PI, ((lo2*180/Math.PI+540)%360)-180]; }
    // PRELOAD (idea di Sam): carica dal file mappa OFFLINE i tile lungo il corridoio davanti, così la
    // geometria c'è anche fuori dallo schermo e la linea arriva fino alla svolta, non solo al bordo visibile.
    var lastPrefetch=0;
    function prefetch(lat,lon,brg,distM){
      var now=Date.now(); if(now-lastPrefetch<3000) return; lastPrefetch=now;
      try{
        var V=getView(), vi=viewInfo(); if(!V||!V.tileCache||!vi||brg<0) return;
        var o=Math.min(15-vi.ld, vi.md); if(o<0)o=0;
        var steps=Math.min(30, Math.max(2, Math.ceil(distM/120))), seen={}, loaded=0;
        for(var s=0;s<=steps;s++){ var p=dest(lat,lon,brg,distM*s/steps);
          var c=Math.floor(lonNx(p[1])*(1<<o)), u=Math.floor(latNy(p[0])*(1<<o));
          for(var ox=-1;ox<=1;ox++) for(var oy=-1;oy<=1;oy++){ var k=(c+ox)+'/'+(u+oy); if(seen[k])continue; seen[k]=1;
            try{ var pr=V.tileCache.get({z:o,x:c+ox,y:u+oy}); if(pr&&pr.catch) pr.catch(function(){}); loaded++; }catch(e){} } }
        logRoute('prefetch '+loaded+' tiles z='+o+' ahead '+Math.round(distM)+'m');
      }catch(e){}
    }
    // Raccoglie le strade attorno all'auto E lungo il corridoio davanti (dai tile già caricati/precaricati).
    function collectRoads(lat,lon,brg,distM){
      var pool=[], seen={};
      function add(lt,ln){ var rs=roadsNear(lt,ln,15); if(!rs.length) rs=roadsNear(lt,ln,14);
        for(var i=0;i<rs.length;i++){ var r=rs[i]; if(r.pts.length<2) continue;
          var key=(r.name||'')+'|'+r.pts[0][0].toFixed(5)+','+r.pts[0][1].toFixed(5)+'|'+r.pts[r.pts.length-1][0].toFixed(5)+'|'+r.pts.length;
          if(seen[key])continue; seen[key]=1; pool.push(r); } }
      add(lat,lon);
      if(brg>=0){ var steps=Math.min(20, Math.max(1, Math.ceil(distM/180)));
        for(var s=1;s<=steps;s++){ var p=dest(lat,lon,brg,distM*s/steps); add(p[0],p[1]); } }
      return pool;
    }
    // Router greedy sulla rete di segmenti: parte dall'auto, segue la strada più dritta (preferendo lo
    // stesso nome), unendo i segmenti connessi anche tra tile diversi, fino a distM metri.
    function traceGraph(pool, carLat, carLon, brg, distM, forceToB){
      var segs=[];
      for(var i=0;i<pool.length;i++){ var pts=pool[i].pts; for(var j=0;j<pts.length-1;j++) segs.push({a:pts[j], b:pts[j+1], name:pool[i].name||''}); }
      if(!segs.length) return null;
      var best=null, P=[carLat,carLon];
      for(var s=0;s<segs.length;s++){ var pr=projSeg(P,segs[s].a,segs[s].b); if(!best||pr.d<best.d) best={s:s,pr:pr}; }
      if(!best) return null;
      if(best.pr.d>35) return {offRoad:true, d:best.pr.d};
      var seg=segs[best.s], start=best.pr.pt;
      // calm.123: verso forzato (true→seg.b, false→seg.a) quando lo decide il chiamante (es. da fermo, dal feed);
      // altrimenti dal GPS heading come prima.
      var fb=bearingOf(seg.a,seg.b), toB=(forceToB===true||forceToB===false)?forceToB:((brg<0)?true:angDiff(brg,fb)<=90);
      var line=[start], acc=0, cur=start, node=(toB?seg.b:seg.a), curName=seg.name, guard=0;
      while(acc<distM && guard++<600){
        var step=md(cur,node);
        if(step>0 && acc+step>=distM){ var r=(distM-acc)/step; line.push([cur[0]+(node[0]-cur[0])*r, cur[1]+(node[1]-cur[1])*r]); acc=distM; break; }
        acc+=step; line.push(node);
        var inBrg=bearingOf(cur,node), bestNext=null, bestScore=1e9;
        for(var s2=0;s2<segs.length;s2++){ var sg=segs[s2];
          var ea=md(node,sg.a)<9, eb=md(node,sg.b)<9; if(!ea&&!eb) continue;
          var other=ea?sg.b:sg.a; if(md(other,cur)<3) continue;   // non tornare indietro
          var ob=bearingOf(node,other), turn=angDiff(inBrg,ob); if(turn>=100) continue;
          var score=turn + ((sg.name&&sg.name===curName)?0:22);
          if(score<bestScore){ bestScore=score; bestNext={other:other,name:sg.name}; } }
        if(!bestNext) break;
        cur=node; node=bestNext.other; curName=bestNext.name;
      }
      return {line:line, acc:acc, reached:acc>=distM*0.95, end:line[line.length-1]};
    }
    var lastRouteLog=0;
    function logRoute(s){ var n=Date.now(); if(n-lastRouteLog<2500) return; lastRouteLog=n; try{AndroidMap.status('route: '+s);}catch(e){} }
    // calm.123: quanto "vale" un tracciato. Se la sua fine arriva sulla strada DOPO la svolta indicata dal feed
    // (navRoad), vale moltissimo: è così che, da fermo, distinguiamo il verso giusto senza GPS heading. In mancanza,
    // vale la distanza raggiunta (il verso che va più lontano sulla strada).
    function endScore(r){
      if(!r || r.offRoad || !r.end) return -1;
      var sc=r.acc||0;
      if(navRoad){
        var jr=roadsNear(r.end[0],r.end[1],15); if(!jr.length) jr=roadsNear(r.end[0],r.end[1],14);
        var want=navRoad.toLowerCase();
        for(var i=0;i<jr.length;i++){ var nm=(jr[i].name||'').toLowerCase(); if(nm&&(nm.indexOf(want)>=0||want.indexOf(nm)>=0)){ sc+=1e6; break; } }
      }
      return sc;
    }
    function retrace(lat,lon,brg){
      try{
        if(!vLogged){ vLogged=true; var vi0=viewInfo(); try{AndroidMap.status('route: view ts='+(vi0?vi0.ts:'?')+' ld='+(vi0?vi0.ld:'?')+' md='+(vi0?vi0.md:'?')+' z='+map.getZoom().toFixed(1));}catch(x){} }
        // calm.126: STICKY. La linea sparisce SOLO quando la navigazione finisce. In tutti gli altri casi incerti
        // (fermo, strada non chiara, fuori strada un attimo) si TIENE l'ultima linea buona invece di cancellarla,
        // così non lampeggia e non sparisce mentre guidi.
        if(!navActive){ clearRoute(); return; }
        if(navDistM<=0){ return; }                 // distanza 0 momentanea (sei sulla svolta): tieni la linea
        var dist=Math.min(navDistM, 5000);
        var haveHeading = brg>=0;
        var forceDir=null, effBrg=brg;
        if(!haveHeading){
          // calm.123: FERMO, nessun heading dal GPS. Decido il verso dal feed CarPlay: traccio la strada sotto l'auto
          // nei due sensi e scelgo quello che finisce sulla strada "dopo la svolta" (navRoad). Così il percorso si
          // vede anche da fermo, senza dover guidare. Appena ci si muove, si usa il GPS heading come sempre.
          var near=collectRoads(lat,lon,-1,0);
          var tB=traceGraph(near, lat,lon, -1, dist, true);   // verso seg.b
          var tA=traceGraph(near, lat,lon, -1, dist, false);  // verso seg.a
          var sB=endScore(tB), sA=endScore(tA);
          if(sB<0 && sA<0){ logRoute('fermo: verso non chiaro — tengo la linea'); return; }   // calm.126: non cancellare
          forceDir=(sB>=sA);                                  // true→seg.b, false→seg.a
          var pick=forceDir?tB:tA;
          effBrg=(pick&&pick.end)?bearingOf([lat,lon],pick.end):-1;
          logRoute('fermo: verso dedotto dal feed (navRoad="'+navRoad+'") sB='+sB.toFixed(0)+' sA='+sA.toFixed(0));
        }
        if(effBrg>=0) prefetch(lat,lon,effBrg,dist);          // precarica i tile davanti anche da fermo, nel verso dedotto
        var pool=collectRoads(lat,lon,effBrg,dist);
        var res=traceGraph(pool, lat,lon, brg, dist, forceDir);
        if(!res){ logRoute('no-roads — tengo la linea'); if(effBrg>=0) prefetch(lat,lon,effBrg,dist); return; }   // calm.126: non cancellare
        if(res.offRoad){ logRoute('off-road d='+res.d.toFixed(0)+'m — tengo la linea'); return; }   // calm.126: blip fuori strada → tieni l'ultima linea buona
        var turn=[];
        if(res.reached && navRoad){
          var jr=roadsNear(res.end[0],res.end[1],15); if(!jr.length) jr=roadsNear(res.end[0],res.end[1],14);
          var want=navRoad.toLowerCase(), cand=null, cd=1e9;
          for(var i=0;i<jr.length;i++){ var nm=(jr[i].name||'').toLowerCase(); if(nm&&(nm.indexOf(want)>=0||want.indexOf(nm)>=0)){
              var s2=snap(res.end[0],res.end[1],[jr[i]]); if(s2&&s2.d<cd){cd=s2.d; cand={r:jr[i],s:s2};} } }
          if(cand&&cd<40){ var tw=walkForward(cand.r,cand.s,-1,80); turn=tw.pts; }
        }
        drawRoute(res.line, turn);
        logRoute('ok pts='+res.line.length+' reach='+res.acc.toFixed(0)+'/'+dist.toFixed(0)+(res.reached?'':' SHORT')+' after="'+navRoad+'"'+(haveHeading?'':' [fermo]')+' t='+turn.length);
        if(!res.reached && effBrg>=0) prefetch(lat,lon,effBrg,dist);   // precarica i tile davanti (verso vero o dedotto): la prossima passata arriva più lontano
      }catch(e){ try{AndroidMap.status('route: err '+e+' — tengo la linea');}catch(x){} }   // calm.126: errore → tieni l'ultima linea
    }
    // dal feed CarPlay (via Java): distanza alla svolta (m), strada dopo, suggerimento direzione
    window.setRoute=function(active, distM, road, turnHint){
      navActive=!!active;
      navDistM=(typeof distM==='number'&&distM>0)?distM:-1;
      navRoad=(road||'').trim(); navTurn=(turnHint||'').trim();
      if(curLL) retrace(curLL[0],curLL[1],lastBrg); else if(!navActive) clearRoute();
    };

    var follow=true, haveFix=false, lastStreet='', loggedQ=false, lastBucket=-1;
    var animFrom=null, animTo=null, animStart=0, animReq=false, curLL=null; var ANIM_MS=1000;
    // calm.117: zoom per velocità in mph, curva tarata con Sam (20–35 mph in una sola fascia = niente "respiro").
    // ZB sposta tutta la curva: +1 = un livello più vicino, −1 = più lontano.
    function zoomForSpeed(ms){
      var mph=ms*2.23694, z;
      if(mph<5) z=17; else if(mph<10) z=16.5; else if(mph<20) z=16; else if(mph<35) z=15.5;
      else if(mph<45) z=15; else if(mph<60) z=14.5; else if(mph<70) z=14; else z=13.5;
      z+=ZB; if(z>18)z=18; if(z<11)z=11; return z;
    }
    var rebtn=document.getElementById('recenter'), streetEl=document.getElementById('street');
    var lastTrack='';
    // "Via | Brano · Artista": la via a sinistra, il brano a destra, separati da una barra. Se manca uno, niente barra.
    function renderStreet(){
      if(HS){ streetEl.style.display='none'; return; }   // calm.119: sulla home la via è un testo nativo sotto l'auto
      var s=lastStreet||'', tk=lastTrack||'';
      streetEl.textContent=(s&&tk)?(s+'   |   '+tk):(s||tk);
    }
    window.setNowPlaying=function(txt){ lastTrack=(txt||'').trim(); renderStreet(); };
    function setFollow(on){ follow=on; rebtn.style.display=on?'none':'block'; }
    map.on('dragstart', function(){ setFollow(false); });
    rebtn.addEventListener('click', function(){ setFollow(true); if(haveFix){ map.setView(anchorCenter(me.getLatLng()), map.getZoom(), {animate:true}); } });

    function resize(){ try{ map.invalidateSize(true); if(haveFix && follow && curLL){ map.setView(anchorCenter(curLL), map.getZoom(), {animate:false}); } }catch(e){} }
    window.addEventListener('resize', resize);
    setTimeout(resize,150); setTimeout(resize,600); setTimeout(resize,1500);

    function propsOf(e){ return (e && e.feature && e.feature.props) || (e && e.props) || null; }
    function roadName(props){
      if(!props) return '';
      return props.name || props['name:en'] || props['name:latin'] || props.ref || '';
    }
    function featuresAt(lat,lon,z){
      var out=[];
      try{
        if(layer.views && layer.views.forEach){
          layer.views.forEach(function(view){
            try{ var r=view.queryFeatures(lon,lat,z,z); if(r && r.length){ for(var i=0;i<r.length;i++) out.push(r[i]); } }catch(e){}   // calm.116: protomaps vuole (lon,lat) — prima erano invertiti → query nell'oceano, road=none
          });
        }
      }catch(e){}
      return out;
    }
    function isRoad(ln){ return ln==='roads'||ln==='transportation'||ln==='transportation_name'; }
    function streetAt(lat,lon){
      var nm='', cnt=0, lset={}, usedZ=-1;
      var zs=[14,15,13,12,16];
      for(var zi=0; zi<zs.length && cnt===0; zi++){
        var arr=featuresAt(lat,lon,zs[zi]);
        if(arr.length){ usedZ=zs[zi];
          for(var i=0;i<arr.length;i++){ var e=arr[i]; cnt++; lset[e.layerName]=1;
            if(!nm && isRoad(e.layerName)){ var n=roadName(propsOf(e)); if(n) nm=n; } }
        }
      }
      if(!loggedQ || (!lastStreet && nm)){ loggedQ=true;
        try{AndroidMap.status('query:'+(cnt?('z'+usedZ+' n='+cnt+' '+Object.keys(lset).slice(0,8).join('+')):'vuoto')+' road='+nm);}catch(e){} }
      if(nm!==lastStreet){ lastStreet=nm; renderStreet(); try{AndroidMap.status('st:'+nm);}catch(e){} }   // calm.119: riporta la via alla home
    }

    function lerpStep(){
      animReq=false;
      if(!animTo) return;
      var p=Math.min(1,(Date.now()-animStart)/ANIM_MS);
      var lat=animFrom[0]+(animTo[0]-animFrom[0])*p, lon=animFrom[1]+(animTo[1]-animFrom[1])*p;
      me.setLatLng([lat,lon]);
      if(follow){ map.panTo(anchorCenter([lat,lon]),{animate:false}); }
      if(p<1){ animReq=true; requestAnimationFrame(lerpStep); } else { curLL=animTo; animFrom=animTo=null; }
    }
    window.setPos=function(lat,lon,speed,bearing){
      var ll=[lat,lon];
      if(typeof bearing==='number'){ setBearing(bearing); if(bearing>=0) lastBrg=bearing; }   // calm.113: heading-up
      if(!haveFix){ me.addTo(map); map.setView(anchorCenter(ll,17),17); haveFix=true; curLL=ll; me.setLatLng(ll); try{AndroidMap.status('fix');}catch(e){} }
      // scorrimento morbido verso il nuovo punto invece di saltare
      animFrom=curLL||ll; animTo=ll; curLL=ll; animStart=Date.now();
      if(!animReq){ animReq=true; requestAnimationFrame(lerpStep); }
      if(follow && typeof speed==='number' && speed>=0){
        var tz=zoomForSpeed(speed), b=Math.round(tz*2);
        if(b!==lastBucket){ lastBucket=b; map.setView(anchorCenter(ll,tz), tz, {animate:true}); }
      }
      streetAt(lat,lon);
      retrace(lat,lon,lastBrg); // calm.114: percorso IN AVANTI fino alla prossima svolta
      calibDump(lat,lon);       // calm.113: geometria strada (diagnostica)
    };
    setTimeout(function(){ var el=document.getElementById('map'); try{AndroidMap.status('size:'+(el?el.clientWidth:'?')+'x'+(el?el.clientHeight:'?')+' tiles='+tileN);}catch(e){} }, 2800);
    try{AndroidMap.status('page-ready');}catch(e){}
  }catch(e){ console.error('map: fatal '+(e&&e.stack?e.stack:e)); try{AndroidMap.status('engine-error:'+e);}catch(x){} }
</script>
