<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="leaflet.css" rel="stylesheet">
<script src="polyfills.js"></script>
<script src="leaflet.js"></script>
<script src="protomaps-leaflet.js"></script>
<style>
  html,body,#map{height:100%;margin:0;background:#0E1114;}
  .leaflet-container{background:#0E1114;}
  .leaflet-control-zoom,.leaflet-control-attribution{display:none !important;}
  #me{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
      background:#7CB8F0;box-shadow:0 0 0 6px rgba(124,184,240,.18),0 0 14px rgba(124,184,240,.5);
      z-index:500;pointer-events:none;}
</style>
</head>
<body>
<div id="map"></div>
<div id="me"></div>
<script>
  window.onerror=function(m,src,ln,col,err){ try{console.error('map: window.onerror '+m+' @'+src+':'+ln);}catch(e){} };
  function q(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):'';}
  console.log('map: page start, origin='+location.origin);
  var purl=location.origin+'/map.pmtiles';
  try{
    var map=L.map('map',{zoomControl:false,attributionControl:false,dragging:false,touchZoom:false,
        doubleClickZoom:false,scrollWheelZoom:false,keyboard:false,boxZoom:false,inertia:false}).setView([52.5,-2.5],15);
    console.log('map: creating layer url='+purl);
    var layer=protomapsL.leafletLayer({url:purl,flavor:'dark',lang:'en'});
    var reported=false;
    function ok(){ if(!reported){ reported=true; try{AndroidMap.status('engine-ok');}catch(e){} } }
    if (layer.on){ layer.on('load', ok); layer.on('tileerror', function(){ try{AndroidMap.status('engine-error:tile');}catch(e){} }); }
    layer.addTo(map);
    console.log('map: layer added');
    // Leaflet renders at the size it had on load; recalc once the panel has real dimensions
    function resize(){ try{ map.invalidateSize(true); }catch(e){} }
    window.addEventListener('resize', resize);
    setTimeout(resize,150); setTimeout(resize,500); setTimeout(resize,1200); setTimeout(resize,2500);
    var tileN=0;
    if (layer.on){ layer.on('tileload', function(){ tileN++; if(tileN===1) console.log('map: first tile drawn'); }); layer.on('tileerror', function(){ try{AndroidMap.status('engine-error:tileerror');}catch(e){} }); }
    setTimeout(function(){ var el=document.getElementById('map'); try{AndroidMap.status('size:'+(el?el.clientWidth:'?')+'x'+(el?el.clientHeight:'?')+' tiles='+tileN);}catch(e){} }, 2800);
    setTimeout(ok, 3000);           // fallback if 'load' never fires
    var first=true;
    window.setPos=function(lat,lon){
      var ll=[lat,lon]; resize();
      if(first){ map.setView(ll,15); first=false; try{AndroidMap.status('fix');}catch(e){} }
      else { map.panTo(ll,{animate:true,duration:0.8}); }
    };
    try{AndroidMap.status('page-ready');}catch(e){}
  }catch(e){ console.error('map: fatal '+(e&&e.stack?e.stack:e)); try{AndroidMap.status('engine-error:'+e);}catch(x){} }
</script>
</body>
</html>
